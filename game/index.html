<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Online Puzzle - Play</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-container">
    <h1>🧩 Online Puzzle</h1>
    <div id="topControls">
      <button id="menuToggleBtn" class="btn btn-primary">☰ Menu</button>
      <button id="previewBtn" class="btn btn-secondary">👁️ Preview</button>
      <button id="shuffleBtn" class="btn btn-secondary" disabled>🔀 Shuffle</button>
    </div>
  </div>
</header>

<main>
  <div id="puzzleArea">
    <div id="controls" class="controls-panel">
      <div class="controls-group">
        <input type="file" id="imageUpload" accept="image/*" title="Upload image" class="file-input">
        <label class="checkbox-label">
          <input type="checkbox" id="enableCheck" checked>
          <span>Check positions</span>
        </label>
      </div>
      <div class="controls-hint">Drag or click on tiles to rearrange them</div>
    </div>

    <div id="puzzle" class="puzzle-grid" aria-label="Puzzle area"></div>

    <div id="previewContainer" class="preview-section" aria-hidden="true">
      <h3>Complete Image Preview:</h3>
      <div id="previewPuzzle" class="preview-grid"></div>
    </div>

    <div class="game-info">
      <div id="message" class="message" aria-live="polite">
        Click "Menu" at the top to select an image and size.
      </div>
      <div class="timer-section">
        <h3 id="timer" class="timer">⏱️ Time: 0:00:000</h3>
      </div>
    </div>
  </div>
</main>

<!-- Completion Overlay -->
<div id="overlayComplete" class="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal modal-completion">
    <div class="completion-header">
      <h2>🎉 Puzzle Complete!</h2>
      <p id="overlayTime" class="completion-time">Time: 0:00:000</p>
    </div>
    <div class="completion-actions">
      <button id="overlayShuffle" class="btn btn-secondary">🔀 Shuffle Again</button>
      <button id="overlayNew" class="btn btn-primary">➕ New Puzzle</button>
      <button id="overlayClose" class="btn btn-ghost">Close</button>
    </div>
  </div>
</div>

<!-- Menu Overlay -->
<div id="menuOverlay" class="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal modal-menu">
    <div class="menu-content">
      <div class="menu-section">
        <h3>📸 Choose Image</h3>
        <div id="presetList" class="preset-list"></div>
        <div class="upload-area">
          <label for="menuUpload" class="upload-label">
            📁 Upload Your Image
          </label>
          <input type="file" id="menuUpload" accept="image/*" style="display:none;">
        </div>
      </div>

      <div class="menu-section">
        <h3>📏 Choose Size</h3>
        <div class="presetSizes" id="presetSizes">
          <button data-cols="3" data-rows="3" class="size-btn">
            <span class="size-label">3×3</span>
            <span class="size-info">Easy</span>
          </button>
          <button data-cols="5" data-rows="6" class="size-btn active">
            <span class="size-label">5×6</span>
            <span class="size-info">Medium</span>
          </button>
          <button data-cols="8" data-rows="6" class="size-btn">
            <span class="size-label">8×6</span>
            <span class="size-info">Hard</span>
          </button>
          <button data-cols="10" data-rows="8" class="size-btn">
            <span class="size-label">10×8</span>
            <span class="size-info">Expert</span>
          </button>
        </div>

        <div class="custom-size">
          <label>Custom Size:</label>
          <div class="custom-inputs">
            <input type="number" id="menuCols" min="1" max="30" value="5">
            <span>×</span>
            <input type="number" id="menuRows" min="1" max="30" value="6">
          </div>
        </div>

        <div class="menu-actions">
          <button id="menuCreate" class="btn btn-primary">🚀 Start Puzzle</button>
          <button id="menuUseUploaded" class="btn btn-secondary">Use Uploaded</button>
          <button id="menuClose" class="btn btn-ghost">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="puzzle.js"></script>

</body>
</html>
